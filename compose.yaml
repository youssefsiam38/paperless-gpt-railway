# Local test topology. Mirrors the Railway deployment: one public service, one volume, and a stand-in
# for the paperless-ngx the deployer already runs.
name: paperless-gpt-railway-test

services:
  gpt:
    # Built from this repository. CI and the Railway template use the published GHCR image instead.
    build:
      context: .
      args:
        WRAPPER_VERSION: ${WRAPPER_VERSION:-0.0.0-local}
        VCS_REF: ${VCS_REF:-local}
    image: ${PAPERLESS_GPT_RAILWAY_IMAGE:-paperless-gpt-railway:local}
    restart: unless-stopped
    environment:
      PORT: '8080'
      PAPERLESS_GPT_AUTH_USERNAME: admin
      PAPERLESS_GPT_AUTH_PASSWORD: local-test-only-paperless-password
      PAPERLESS_BASE_URL: http://paperless:8000
      PAPERLESS_API_TOKEN: local-test-only-paperless-token
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4o-mini
      OPENAI_API_KEY: sk-local-test-only-not-a-real-key
      TZ: UTC
    volumes:
      - db:/app/db
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      - paperless

  # A stand-in for paperless-ngx: enough of its API for the wrapper's reachability check and for
  # the tests to exercise the routes without pulling the real thing.
  paperless:
    image: docker.io/library/python:3.12-alpine
    restart: unless-stopped
    command:
      - python
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, HTTPServer
        TOKEN = "local-test-only-paperless-token"
        DOCS = {"count": 1, "results": [{"id": 1, "title": "Invoice", "tags": [1], "content": "x"}]}
        TAGS = {"count": 1, "results": [{"id": 1, "name": "paperless-gpt"}]}
        class H(BaseHTTPRequestHandler):
            def _auth(self):
                return self.headers.get("Authorization") == "Token " + TOKEN
            def do_GET(self):
                if not self._auth():
                    self.send_response(401); self.end_headers(); return
                body = TAGS if self.path.startswith("/api/tags") else DOCS
                out = json.dumps(body).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(out)))
                self.end_headers(); self.wfile.write(out)
            def log_message(self, *a): pass
        HTTPServer(("0.0.0.0", 8000), H).serve_forever()

volumes:
  db:
